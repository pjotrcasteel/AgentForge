name: Validate .NET 10
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TokenBudget.slnx --disable-parallel -m:1
      - name: Build
        run: dotnet build TokenBudget.slnx --no-restore -c Release -m:1
      - name: Test
        run: dotnet test TokenBudget.slnx --no-build -c Release -m:1 --verbosity normal
      - name: Pack AgentForge tool
        run: dotnet pack src/TokenBudget.Cli/TokenBudget.Cli.csproj --no-build -c Release --output artifacts
      - name: Install packaged AgentForge tool
        run: dotnet tool install --tool-path .\artifacts\tool-smoke --add-source .\artifacts AgentForge.TokenBudget.Cli --version 1.3.0-preview.1
      - name: Verify MCP startup, tool discovery and one-prompt preflight
        run: python scripts/smoke_mcp.py .\artifacts\tool-smoke\agentforge.exe
      - name: Upload installable tool
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-dotnet10-tool-preview
          path: artifacts/*.nupkg
          if-no-files-found: error
